name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # macos-15 is the arm64 image; the project builds arm64 only.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Pinned to the Xcode the project is developed with. Bump when the image drops this version.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version lives in project.yml. The tag has to agree with it, or the release would
      # carry a version the app does not report.
      - name: Check the tag against the project version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2 }' project.yml)"
          if [ "${tag}" != "${project}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${project} in project.yml" >&2
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      # build.sh picks up a Developer ID certificate from the keychain on its own, so the
      # certificate only has to be present in the search list.
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/build.keychain-db"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo -n "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security list-keychain -d user -s "${keychain}" login.keychain-db
          rm -f "${certificate}"

      - name: Build
        run: ./build.sh

      - name: Notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh
          rm -f "${key}"

      # Packaged after stapling, so the archive carries the notarization ticket.
      - name: Package the stapled app
        run: ditto -c -k --keepParent Blip.app "Blip-${{ steps.version.outputs.version }}.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "Blip-${{ steps.version.outputs.version }}.zip" --generate-notes
