name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-15 is the arm64 image; the project builds arm64 only.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Pinned to the Xcode the project is developed with. Bump when the image drops this version.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version lives in project.yml. The tag has to agree with it, or the release would
      # carry a version the app does not report.
      - name: Check the tag against the project version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2 }' project.yml)"
          if [ "${tag}" != "${project}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${project} in project.yml" >&2
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"

      # XcodeGen generates the project; create-dmg lays out the disk image window.
      - name: Install the build tools
        run: brew install xcodegen create-dmg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      # build.sh picks up a Developer ID certificate from the keychain on its own, so the
      # certificate only has to be present in the search list.
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/build.keychain-db"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo -n "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security list-keychain -d user -s "${keychain}" login.keychain-db
          rm -f "${certificate}"

      - name: Build
        run: ./build.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh
          rm -f "${key}"

      # Packaged after stapling, so the archive carries the notarization ticket.
      - name: Package the stapled app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --keepParent Blip.app "Blip-${VERSION}.zip"

      # Built from the stapled app, so the copy a user drags out of the image carries its ticket.
      # The image gets its own ticket below, because the quarantine attribute lands on the download.
      - name: Build the disk image
        run: ./Scripts/make-dmg.sh

      - name: Notarize the disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh "Blip-${VERSION}.dmg"
          rm -f "${key}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${GITHUB_REF_NAME}" "Blip-${VERSION}.zip" "Blip-${VERSION}.dmg" --generate-notes

      # Everything from here runs after the release exists, so a failure leaves the release intact
      # and only the feed or the cask behind.
      - name: Check out the update feed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: feed

      - name: Publish the update to the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          # Pinned to the version the app links against, so the signature format cannot drift
          SPARKLE_VERSION: "2.9.6"
          SPARKLE_SHA256: "8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606"
        run: |
          set -euo pipefail

          # sign_update ships inside Sparkle's own distribution, and the archive's checksum is the
          # one Sparkle publishes in its Package.swift.
          tools="${RUNNER_TEMP}/sparkle"
          mkdir -p "${tools}"
          curl -fsSL -o "${tools}/sparkle.zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          actual="$(shasum -a 256 "${tools}/sparkle.zip" | awk '{ print $1 }')"
          if [ "${actual}" != "${SPARKLE_SHA256}" ]; then
            echo "Sparkle archive checksum mismatch: expected ${SPARKLE_SHA256}, got ${actual}" >&2
            exit 1
          fi
          unzip -q "${tools}/sparkle.zip" -d "${tools}"
          chmod +x "${tools}/bin/sign_update"

          # The key arrives on standard input; sign_update's -s option is deprecated and does not
          # accept keys generated by current versions.
          signature="$(printf '%s' "${SPARKLE_PRIVATE_KEY}" \
            | "${tools}/bin/sign_update" --ed-key-file - "Blip-${VERSION}.zip")"
          case "${signature}" in
            *sparkle:edSignature=*) ;;
            *) echo "sign_update did not return a signature: ${signature}" >&2; exit 1 ;;
          esac

          # Sparkle shows the release body in its update dialog. release-notes.yml runs the same
          # script again whenever the body is edited later, which is when the written notes arrive.
          ./Scripts/make-release-notes.sh "${GITHUB_REF_NAME}" "feed/release-notes/${VERSION}.html"

          # The newest item goes directly after the channel metadata, so the feed reads newest
          # first without rewriting what is already there.
          pubdate="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          minimum="$(awk '/MACOSX_DEPLOYMENT_TARGET:/ { gsub(/"/, "", $2); print $2 }' project.yml)"

          # sparkle:version is what Sparkle weighs against the installed CFBundleVersion to decide
          # an update is newer, so the two have to be the same kind of number. project.yml sets
          # CFBundleVersion from MARKETING_VERSION, which leaves one number to raise per release.
          #
          # Going backwards would publish a release nobody is offered, and nothing else would
          # report that, so refuse a version the feed has already passed.
          highest="$(grep -o 'sparkle:version="[^"]*"' feed/appcast.xml | cut -d'"' -f2 | sort -V | tail -1)"
          if [ -n "${highest}" ]; then
            newest="$(printf '%s\n%s\n' "${VERSION}" "${highest}" | sort -V | tail -1)"
            if [ "${VERSION}" = "${highest}" ] || [ "${newest}" != "${VERSION}" ]; then
              echo "${VERSION} is not above ${highest}, which the feed already carries" >&2
              exit 1
            fi
          fi

          item="${RUNNER_TEMP}/item.xml"
          cat > "${item}" <<XML
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${pubdate}</pubDate>
                <sparkle:minimumSystemVersion>${minimum}</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://blip.dominion525.com/release-notes/${VERSION}.html</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/dominion525/blip/releases/download/${GITHUB_REF_NAME}/Blip-${VERSION}.zip"
                           sparkle:version="${VERSION}"
                           sparkle:shortVersionString="${VERSION}"
                           ${signature}
                           type="application/octet-stream"/>
              </item>
          XML
          sed -i '' -e "/<\\/language>/r ${item}" feed/appcast.xml

          # A feed that did not gain the version would go unnoticed until nobody could update.
          grep -q "<title>Version ${VERSION}</title>" feed/appcast.xml \
            || { echo "the appcast did not gain an item for ${VERSION}" >&2; exit 1; }
          xmllint --noout feed/appcast.xml

          cd feed
          git add -A
          if git diff --cached --quiet; then
            echo "The feed already carries ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Blip ${VERSION}"
          git push

      # The token is a fine-grained PAT that can write to the tap alone.
      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dominion525/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CASK: tap/Casks/dominion525-blip.rb
        run: |
          set -euo pipefail

          # The archive on disk is the one that was just uploaded, so there is nothing to download.
          sha="$(shasum -a 256 "Blip-${VERSION}.zip" | awk '{ print $1 }')"

          # Only the two lines that change per release are touched. Everything else in the cask
          # stays owned by the tap rather than being generated from here.
          sed -i '' "s|^  version \".*\"|  version \"${VERSION}\"|" "${CASK}"
          sed -i '' "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "${CASK}"

          # A sed that matched nothing would leave the cask stale without failing, so check both.
          grep -qx "  version \"${VERSION}\"" "${CASK}" || { echo "version was not updated in ${CASK}" >&2; exit 1; }
          grep -qx "  sha256 \"${sha}\"" "${CASK}" || { echo "sha256 was not updated in ${CASK}" >&2; exit 1; }

          # Never push a cask that does not parse. The tap runs the full tap-syntax check of its
          # own once this lands, but that is too late to stop a broken file.
          brew style "${CASK}"

          cd tap
          if git diff --quiet; then
            echo "The cask already points at ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "dominion525-blip ${VERSION}"
          git push
