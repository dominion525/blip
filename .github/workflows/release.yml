name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-15 is the arm64 image; the project builds arm64 only.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Pinned to the Xcode the project is developed with. Bump when the image drops this version.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version lives in project.yml. The tag has to agree with it, or the release would
      # carry a version the app does not report.
      - name: Check the tag against the project version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2 }' project.yml)"
          if [ "${tag}" != "${project}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${project} in project.yml" >&2
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"

      # XcodeGen generates the project; create-dmg lays out the disk image window.
      - name: Install the build tools
        run: brew install xcodegen create-dmg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      # build.sh picks up a Developer ID certificate from the keychain on its own, so the
      # certificate only has to be present in the search list.
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/build.keychain-db"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo -n "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security list-keychain -d user -s "${keychain}" login.keychain-db
          rm -f "${certificate}"

      - name: Build
        run: ./build.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh
          rm -f "${key}"

      # Packaged after stapling, so the archive carries the notarization ticket.
      - name: Package the stapled app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --keepParent Blip.app "Blip-${VERSION}.zip"

      # Built from the stapled app, so the copy a user drags out of the image carries its ticket.
      # The image gets its own ticket below, because the quarantine attribute lands on the download.
      - name: Build the disk image
        run: ./Scripts/make-dmg.sh

      - name: Notarize the disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh "Blip-${VERSION}.dmg"
          rm -f "${key}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${GITHUB_REF_NAME}" "Blip-${VERSION}.zip" "Blip-${VERSION}.dmg" --generate-notes

      # The cask is bumped after the release exists, so a failure here leaves the release intact
      # and only the cask behind. The token is a fine-grained PAT that can write to the tap alone.
      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dominion525/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CASK: tap/Casks/dominion525-blip.rb
        run: |
          set -euo pipefail

          # The archive on disk is the one that was just uploaded, so there is nothing to download.
          sha="$(shasum -a 256 "Blip-${VERSION}.zip" | awk '{ print $1 }')"

          # Only the two lines that change per release are touched. Everything else in the cask
          # stays owned by the tap rather than being generated from here.
          sed -i '' "s|^  version \".*\"|  version \"${VERSION}\"|" "${CASK}"
          sed -i '' "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "${CASK}"

          # A sed that matched nothing would leave the cask stale without failing, so check both.
          grep -qx "  version \"${VERSION}\"" "${CASK}" || { echo "version was not updated in ${CASK}" >&2; exit 1; }
          grep -qx "  sha256 \"${sha}\"" "${CASK}" || { echo "sha256 was not updated in ${CASK}" >&2; exit 1; }

          # Never push a cask that does not parse. The tap runs the full tap-syntax check of its
          # own once this lands, but that is too late to stop a broken file.
          brew style "${CASK}"

          cd tap
          if git diff --quiet; then
            echo "The cask already points at ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "dominion525-blip ${VERSION}"
          git push
